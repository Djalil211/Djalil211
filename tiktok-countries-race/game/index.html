<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0118" />
  <meta name="description" content="سباق الدول العربية — لعبة تفاعلية بأسلوب البث المباشر" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <title>سباق الدول — بث مباشر</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== شاشة اختيار الدول ===== -->
  <div id="setup" class="setup">
    <div class="setup-card">
      <h2>🏁 اختر الدول المشاركة</h2>
      <p class="setup-sub">حدّد الدول قبل بدء السباق</p>
      <div class="quick">
        <button class="qbtn" data-q="all">الكل</button>
        <button class="qbtn" data-q="none">مسح</button>
        <button class="qbtn" data-q="maghreb">المغرب العربي</button>
        <button class="qbtn" data-q="gulf">الخليج</button>
        <button class="qbtn" data-q="levant">المشرق</button>
        <button class="qbtn" data-q="random12">12 عشوائية</button>
      </div>
      <div id="chips" class="chips"></div>
      <div class="setup-foot">
        <span class="sel-count">المحدّد: <b id="sel-count">0</b></span>
        <button id="start-race" class="btn btn-primary" disabled>ابدأ السباق 🏁</button>
      </div>
    </div>
  </div>

  <!-- ===== شريط البث المباشر ===== -->
  <header class="live-bar">
    <div class="live-badge"><span class="live-dot"></span> مباشر</div>
    <div class="viewers"><span id="eye">👁</span> <span id="viewer-count">0</span></div>
    <div class="top-actions">
      <button id="sound-toggle" class="icon-btn" title="الصوت">🔊</button>
      <button id="change" class="icon-btn" title="تغيير الدول">⚙️</button>
      <button id="share-btn" class="icon-btn" title="مشاركة">↗</button>
    </div>
  </header>

  <div id="chat-layer" class="chat-layer" aria-hidden="true"></div>
  <div id="gift-layer" class="gift-layer" aria-hidden="true"></div>
  <div id="heart-layer" class="heart-layer" aria-hidden="true"></div>
  <canvas id="confetti" class="confetti"></canvas>

  <main class="game">
    <div class="title-row">
      <h1>🏁 سباق الدول العربية</h1>
      <div class="sub" id="race-status">اضغط على سيارة أي دولة لدفعها نحو خط النهاية!</div>
    </div>

    <div class="track-wrap">
      <div id="lanes" class="lanes"></div>
      <div class="finish-line">
        <div class="finish-flag">🏁</div>
        <div class="finish-tape">نهاية السباق</div>
      </div>
    </div>

    <div class="controls-row">
      <button id="restart" class="btn btn-ghost">🔄 سباق جديد</button>
      <button id="rush" class="btn btn-primary">⚡ تسريع جماعي</button>
    </div>
  </main>

  <div id="winner-modal" class="modal hidden">
    <div class="modal-card">
      <div class="trophy">🏆</div>
      <div class="winner-label">الفائز بالسباق</div>
      <div id="winner-flag" class="winner-flag">🏁</div>
      <div id="winner-name" class="winner-name">—</div>
      <button id="play-again" class="btn btn-primary big">🎉 سباق جديد</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
